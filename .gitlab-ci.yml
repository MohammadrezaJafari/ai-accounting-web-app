---
stages:
  - build
  - deploy

include:

  # =========================
  # PLAYGROUND BUILD
  # =========================

  - component: gitlab.rahap.site/devops/cicd-catalog/build@main
    inputs:
      job_name: "ai-accounting-web-playground"
      job_tags:
        - shared-runner
      job_rules:
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
          when: manual
          allow_failure: false
      registry: harbor.rahap.site
      image_name: ai/ai-accounting-web/playground
      dockerfile: Dockerfile
      dockerfile_path: .
      build_args: ""

  # =========================
  # PLAYGROUND DEPLOY
  # =========================

  - component: gitlab.rahap.site/devops/cicd-catalog/deploy@main
    inputs:
      job_name: "ai-accounting-web-playground"
      job_tags:
        - shared-runner
      job_rules:
        - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main"'
          when: manual
          allow_failure: false
      job_needs:
        - "Build: ai-accounting-web-playground"
      registry: harbor.rahap.site
      service_image_name: ai/ai-accounting-web/playground
      helm_release_name: ai-accounting-web
      helm_namespace: playground
      helm_values_file: values-playground.yaml
