server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # SPA با history mode: هر مسیر ناشناخته index.html را می‌دهد (/api و /v1 پیش از رسیدن به این‌جا
  # با HTTPRoute به بک‌اند می‌روند).
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    index index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
